<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saint Enterprise Academy</title>
  
  <!-- Tailwind CSS Play CDN for instant testing -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Embedded Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            saint: {
              dark: "#0B0C10",
              surface: "#1F2833",
              primary: "#45A29E",
              secondary: "#66FCF1",
              accent: "#C5C6C7"
            },
            aurora: {
              blue: "#3b82f6",
              purple: "#8b5cf6",
              teal: "#14b8a6"
            }
          },
          backgroundImage: {
            'kinetic-grid': `linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), 
                             linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px)`,
          },
          keyframes: {
            'aurora-shift': {
              '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
            },
            'grid-pan': {
              '0%': { transform: 'translateY(0)' },
              '100%': { transform: 'translateY(32px)' },
            }
          },
          animation: {
            'aurora-1': 'aurora-shift 12s ease-in-out infinite',
            'aurora-2': 'aurora-shift 15s ease-in-out infinite reverse',
            'aurora-3': 'aurora-shift 18s ease-in-out infinite',
            'grid-flow': 'grid-pan 3s linear infinite',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-saint-dark selection:bg-saint-primary selection:text-white m-0 p-0">

  <!-- Main Application Wrapper -->
  <div class="relative min-h-[100dvh] overflow-hidden text-saint-accent font-sans">
    
    <!-- BACKGROUND: Aurora Glows -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
      <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-aurora-purple rounded-full mix-blend-screen filter blur-[80px] animate-aurora-1"></div>
      <div class="absolute top-[20%] right-[-10%] w-[60vw] h-[60vw] bg-aurora-blue rounded-full mix-blend-screen filter blur-[90px] animate-aurora-2"></div>
      <div class="absolute bottom-[-10%] left-[20%] w-[70vw] h-[70vw] bg-aurora-teal rounded-full mix-blend-screen filter blur-[100px] animate-aurora-3"></div>
    </div>

    <!-- BACKGROUND: Kinetic Grid -->
    <div class="absolute inset-0 z-0 pointer-events-none [mask-image:radial-gradient(ellipse_at_center,black_20%,transparent_70%)]">
      <div class="absolute inset-[-100%] bg-kinetic-grid bg-[length:32px_32px] animate-grid-flow opacity-30"></div>
    </div>

    <!-- FOREGROUND: Content Layout -->
    <div class="relative z-10 flex flex-col min-h-[100dvh] h-full">
      
      <!-- Header -->
      <header class="flex justify-between items-center p-6 bg-gradient-to-b from-saint-dark/80 to-transparent backdrop-blur-sm">
        <div class="flex items-center gap-2">
          <!-- Logo Placeholder -->
          <div class="w-8 h-8 rounded-lg bg-saint-primary flex items-center justify-center font-bold text-saint-dark shadow-[0_0_15px_rgba(69,162,158,0.5)]">
            SA
          </div>
          <h1 class="text-xl font-semibold tracking-wide text-white">Saint<span class="text-saint-primary">Enterprise</span></h1>
        </div>
        <button class="p-2 rounded-full bg-saint-surface/50 border border-white/10 text-white backdrop-blur-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
      </header>

      <!-- Main Scrollable Content -->
      <main class="flex-1 px-6 pb-28 overflow-y-auto">
        
        <!-- Hero Section -->
        <section class="mt-8 mb-10 text-center">
          <h2 class="text-3xl font-bold text-white mb-3">Welcome to the Academy</h2>
          <p class="text-sm text-saint-accent max-w-xs mx-auto">Master modern workflows with kinetic intelligence and enterprise scale.</p>
        </section>

        <!-- Glassmorphic Dashboard Cards -->
        <section class="grid grid-cols-1 gap-4">
          <!-- Card 1 -->
          <div class="p-5 rounded-2xl bg-white/[0.03] border border-white/[0.05] backdrop-blur-xl shadow-xl transition-transform active:scale-95">
            <div class="flex items-center justify-between mb-2">
              <h3 class="font-medium text-white">Active Modules</h3>
              <span class="px-2 py-1 text-xs font-semibold rounded-full bg-saint-primary/20 text-saint-secondary">Live</span>
            </div>
            <p class="text-2xl font-bold text-white">12 <span class="text-sm font-normal text-saint-accent">/ 15 Completed</span></p>
          </div>

          <!-- Card 2 -->
          <div class="p-5 rounded-2xl bg-white/[0.03] border border-white/[0.05] backdrop-blur-xl shadow-xl transition-transform active:scale-95">
            <h3 class="font-medium text-white mb-3">Quick Actions</h3>
            <div class="grid grid-cols-2 gap-3">
              <button class="py-3 rounded-xl bg-saint-surface border border-white/10 text-sm font-medium text-white hover:bg-white/10 transition-colors">Start Course</button>
              <button class="py-3 rounded-xl bg-saint-primary text-saint-dark font-medium text-sm hover:bg-saint-secondary transition-colors shadow-[0_0_20px_rgba(69,162,158,0.3)]">View Reports</button>
            </div>
          </div>
        </section>

      </main>

      <!-- Floating Bottom Navigation (Mobile) -->
      <nav class="fixed bottom-6 left-6 right-6 p-4 rounded-2xl bg-saint-dark/80 border border-white/10 backdrop-blur-2xl shadow-2xl flex justify-around items-center z-50">
        <button class="text-saint-primary flex flex-col items-center gap-1 transition-transform active:scale-90">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </button>
        <button class="text-saint-accent hover:text-white flex flex-col items-center gap-1 transition-transform active:scale-90">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        </button>
        <button class="text-saint-accent hover:text-white flex flex-col items-center gap-1 transition-transform active:scale-90">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
      </nav>
      
    </div>
  </div>
</body>
</html>
